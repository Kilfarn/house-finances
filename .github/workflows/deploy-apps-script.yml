name: Deploy app to Google Apps Script

# Pushes apps-script/ to the House Finances Apps Script project and updates the
# existing web app deployment, so the /exec link stays the same.
# Needs: secret CLASPRC_JSON (from `npx @google/clasp@2.4.2 login`),
#        repository variables SCRIPT_ID and DEPLOYMENT_ID.

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

concurrency: apps-script-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check setup
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          missing=""
          [ -z "$CLASPRC" ] && missing="$missing secret CLASPRC_JSON,"
          [ -z "$SCRIPT_ID" ] && missing="$missing variable SCRIPT_ID,"
          [ -z "$DEPLOYMENT_ID" ] && missing="$missing variable DEPLOYMENT_ID,"
          if [ -n "$missing" ]; then echo "::error::Not set up yet. Missing:$missing"; exit 1; fi

      - name: Write clasp credentials and project file
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json

      - name: Push code
        run: npx --yes @google/clasp@2.4.2 push --force

      - name: Update the web app deployment
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: npx --yes @google/clasp@2.4.2 deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f ~/.clasprc.json
